services:
  nusantara-api:
    ports: !override ["127.0.0.1:${NUSANTARA_AUDIT_PORT:-18212}:18201"]
    env_file: !reset []
    environment:
      NUSANTARA_ADMIN_TOKEN: ${NUSANTARA_AUDIT_ADMIN_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: llama3.2:1b
