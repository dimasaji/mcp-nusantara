services:
  nusantara-api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    ports: ["127.0.0.1:${NUSANTARA_API_PORT:-18201}:18201"]
    environment:
      NUSANTARA_DATA_DIR: /app/data
      NUSANTARA_KNOWLEDGE_DB: /app/data/knowledge/nusantara_knowledge.db
      NUSANTARA_HEALTHCHECK_PORT: "18201"
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
    volumes: [apidata:/app/data, apphome:/home/appuser]
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    networks: [nusantara]
volumes: {apidata: {}, apphome: {}}
networks: {nusantara: {}}
