services:
  nusantara-api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      NUSANTARA_DATA_DIR: /app/data
      NUSANTARA_KNOWLEDGE_DB: /app/data/knowledge/nusantara_knowledge.db
    volumes: [apidata:/app/data, apphome:/home/appuser]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    networks: [nusantara]
    depends_on: [redis, database]
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nusantara
      POSTGRES_USER: nusantara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [nusantara]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [nusantara]
volumes: {pgdata: {}, apidata: {}, apphome: {}}
networks: {nusantara: {}}
