<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nusantara Graph Viewer</title>
</head>
<body>
<h2>Nusantara Core - Graph Viewer</h2>
<div id="status">Loading graph...</div>

<script>
fetch("/graph.json")
.then(r => {
    if (!r.ok) throw new Error("graph.json tidak ditemukan");
    return r.json();
})
.then(data => {
    const nodes = data.nodes || [];
    const edges = data.edges || data.links || [];

    document.getElementById("status").innerHTML =
        "Graph berhasil dimuat.<br>" +
        "Nodes: " + nodes.length + "<br>" +
        "Edges: " + edges.length;
})
.catch(err => {
    document.getElementById("status").innerText =
        "ERROR: " + err.message;
});
</script>

</body>
</html>
